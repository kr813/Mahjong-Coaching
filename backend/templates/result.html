<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀 AI牌譜添削ツール - 解析結果</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 640px;
            box-sizing: border-box;
        }

        .header-area {
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .episode-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }

        .tiles-area {
            background-color: #e8f4f8;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 16px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #2980b9;
        }

        /* 牌のフォントサイズを調整するスタイル */
        .tile-font {
            font-size: 1.5em;
            /* 2.5em から小さく変更（例: 1.5em ~ 1.8em） */
            line-height: 1;
            vertical-align: middle;
            margin: 0 -5px;
            /* 牌同士の間隔も必要に応じて狭める */
        }

        /* 💡 赤ドラ用のスタイル（赤みと、必要に応じて微調整） */
        .red-tile {
            color: #e74c3c !important;
            text-shadow: 0 0 2px rgba(231, 76, 60, 0.3);
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .comparison-box {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .box-user {
            background-color: #fdf2f2;
            border: 1px solid #f9d5d5;
        }

        .box-ai {
            background-color: #f2fbf5;
            border: 1px solid #d5f5e3;
        }

        .box-label {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .tile-name {
            font-size: 24px;
            font-weight: bold;
        }

        .box-user .tile-name {
            color: #c0392b;
        }

        .box-ai .tile-name {
            color: #27ae60;
        }

        .q-value-badge {
            background-color: #e67e22;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-box;
            margin-bottom: 20px;
        }

        .commentary-area {
            background-color: #f9f9f9;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin-bottom: 30px;
            text-align: left;
            line-height: 1.6;
        }

        .btn-back {
            display: inline-block;
            width: 100%;
            max-width: 240px;
            padding: 12px;
            background-color: #7f8c8d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-back:hover {
            background-color: #95a5a6;
        }
    </style>
</head>

<body>

    <div class="main-content">
        <div class="container">
            <div class="header-area">
                <div class="episode-title">{{ kyoku }} {{ turn }}巡目</div>
            </div>

            <!-- 手牌の表示（赤ドラは .red-tile で赤く染める） -->
            <div class="tiles-area">
                手牌:
                <span class="tile-font">
                    {% for tile in tehai_data %}
                    <span class="tile-font {% if tile.is_red %}red-tile{% endif %}">{{ tile.emoji }}</span>
                    {% endfor %}
                </span>
            </div>

            <div class="comparison-grid">
                <div class="comparison-box box-user">
                    <div class="box-label">あなたの打牌</div>
                    <div class="tile-name {% if player_is_red %}red-tile{% endif %}">{{ player_discard }}</div>
                </div>
                <div class="comparison-box box-ai">
                    <div class="box-label">AIの推奨打牌</div>
                    <div class="tile-name {% if ai_is_red %}red-tile{% endif %}">{{ ai_discard }}</div>
                </div>
            </div>

            <div class="q-value-badge">期待値ロス: {{ "%.4f"|format(loss) }}</div>

            <div class="commentary-area">
                <strong>💡 AIからのアドバイス：</strong><br>
                {{ commentary | safe }}
            </div>

            <button class="btn-back" onclick="goToTop()">トップに戻る</button>
        </div>
    </div>

    <script>
        function goToTop() {
            window.location.href = "/";
        }
    </script>

</body>

</html>
